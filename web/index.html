<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>osmo_egprs — Operations Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');

  /* ═══ Solarized Theme ═══ */
  [data-theme="dark"] {
    --base03: #002b36; --base02: #073642; --base01: #586e75;
    --base00: #657b83; --base0: #839496; --base1: #93a1a1;
    --base2: #eee8d5; --base3: #fdf6e3;
    --yellow: #b58900; --orange: #cb4b16; --red: #dc322f;
    --magenta: #d33682; --violet: #6c71c4; --blue: #268bd2;
    --cyan: #2aa198; --green: #859900;

    --bg-0: #001e26; --bg-1: #002b36; --bg-2: #073642; --bg-3: #0a4050;
    --border: #0d4f5a; --border-b: #11616e;
    --t0: #fdf6e3; --t1: #eee8d5; --t2: #93a1a1; --t3: #586e75;
    --term-bg: #001a20; --term-text: #93a1a1;
    --shadow: 0 4px 24px rgba(0,0,0,0.6);
    --hex-offset: #586e75; --hex-byte: #93a1a1; --hex-ascii: #859900;
    --hex-highlight: rgba(42,161,152,0.08);
  }
  [data-theme="light"] {
    --base03: #002b36; --base02: #073642; --base01: #586e75;
    --base00: #657b83; --base0: #839496; --base1: #93a1a1;
    --base2: #eee8d5; --base3: #fdf6e3;
    --yellow: #b58900; --orange: #cb4b16; --red: #dc322f;
    --magenta: #d33682; --violet: #6c71c4; --blue: #268bd2;
    --cyan: #2aa198; --green: #859900;

    --bg-0: #fdf6e3; --bg-1: #eee8d5; --bg-2: #e6dfca; --bg-3: #ddd6c1;
    --border: #d0c8b0; --border-b: #c0b898;
    --t0: #002b36; --t1: #073642; --t2: #586e75; --t3: #93a1a1;
    --term-bg: #002b36; --term-text: #93a1a1;
    --shadow: 0 4px 16px rgba(0,0,0,0.15);
    --hex-offset: #586e75; --hex-byte: #073642; --hex-ascii: #859900;
    --hex-highlight: rgba(42,161,152,0.06);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:var(--bg-0); color:var(--t0);
    font-family:'Source Sans 3',system-ui,sans-serif;
    font-size:14px; overflow:hidden;
  }
  /* ═══ Adaptation a la fenetre ═══════════════════════════════════════════
     Le tableau de bord etait fige : #app en 100vh, overflow:hidden sur body,
     et des largeurs minimales (les cartes FFT font 380 px chacune). Sur un
     ecran plus petit que ce que la mise en page demande - un portable, une
     fenetre a moitie d'ecran, une VM en 1024x768 - le contenu etait
     simplement COUPE, sans barre de defilement pour aller le chercher : la
     seconde colonne n'existait plus, et rien ne le disait.
     On reduit donc jusqu'a 70 %, ce qui reste lisible ; en dessous on arrete
     de reduire et on rend le defilement. Reduire indefiniment donnerait un
     texte que personne ne peut lire, ce qui n'est pas mieux que le couper. */
  #app {
    transform-origin: top left;
    /* --k est pose par fitApp() ; 1 = taille naturelle. Les dimensions sont
       divisees par --k pour que la mise en page se calcule a la taille PLEINE
       et ne soit reduite qu'au rendu - sinon on reduirait un layout deja
       comprime, et les deux effets se cumuleraient. */
    width:  calc(100% / var(--k, 1));
    height: calc(100% / var(--k, 1));
    transform: scale(var(--k, 1));
  }
  /* Quand la reduction bute sur son plancher, c'est le corps qui defile. */
  body.app-scroll { overflow:auto; }
  code, .mono, .vty-screen, .vty-input, .pkt-table, #cap-filter, .hex-dump {
    font-family:'Fira Code',monospace;
  }

  /* ═══ Layout ═══ */
  /* height:100vh remplace par 100% : #app est desormais mis a l'echelle, et
     100vh se rapporte a la fenetre, pas au conteneur - la hauteur ne suivait
     donc pas la division par --k et le bas de page etait rogne. */
  #app { display:flex; flex-direction:column; height:100%; }

  /* ═══ Header ═══ */
  header {
    background:var(--bg-1); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 16px; gap:12px;
    height:48px; flex-shrink:0;
  }
  .logo {
    font-family:'Fira Code',monospace; font-weight:700; font-size:16px;
    color:var(--green); letter-spacing:.06em;
  }
  .sep { width:1px; height:22px; background:var(--border-b); flex-shrink:0; }
  .htag {
    font-size:11px; padding:3px 10px; border-radius:4px;
    background:var(--bg-2); color:var(--t2); white-space:nowrap;
    font-family:'Fira Code',monospace;
  }
  .htag.on { background:rgba(133,153,0,0.15); color:var(--green); }
  .hright { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .btn {
    background:var(--bg-2); border:1px solid var(--border-b); color:var(--t1);
    font-family:'Source Sans 3',sans-serif; font-size:12px; font-weight:600;
    padding:5px 14px; cursor:pointer; border-radius:4px; transition:all .12s;
    white-space:nowrap;
  }
  .btn:hover { background:var(--bg-3); color:var(--t0); }
  .btn.primary { border-color:rgba(133,153,0,0.4); }
  .btn.primary:hover { background:rgba(133,153,0,0.15); color:var(--green); }
  .btn.danger:hover { background:rgba(220,50,47,0.15); color:var(--red); }
  .btn.vty-btn { border-color:rgba(42,161,152,0.4); }
  .btn.vty-btn:hover { background:rgba(42,161,152,0.15); color:var(--cyan); }

  /* ═══ View tabs (Console / FFT) ═══ */
  .vtabs { display:flex; gap:4px; }
  .vtab {
    background:var(--bg-2); border:1px solid var(--border-b); color:var(--t2);
    font-family:'Fira Code',monospace; font-size:12px; font-weight:600;
    padding:5px 14px; cursor:pointer; border-radius:4px; transition:all .12s;
  }
  .vtab:hover { color:var(--t0); }
  .vtab.active { background:rgba(42,161,152,0.15); color:var(--cyan); border-color:rgba(42,161,152,0.4); }

  /* ═══ FFT view ═══ */
  #fft-view { flex:1; overflow:auto; padding:12px; min-height:0; }
  /* height:100% valait pour l unique rangee d avant. Avec deux rangees, il
     donnait deux fois la hauteur du conteneur et la seconde partait hors
     ecran. Chacune prend ce qu elle demande ; c est le journal qui s etire. */
  .fft-row { display:flex; gap:12px; flex-wrap:wrap; }
  .fft-row + .fft-row { margin-top:12px; }
  .fft-row-log .fft-card { min-height:220px; }
  .fft-card {
    flex:1; min-width:380px; display:flex; flex-direction:column;
    background:var(--bg-1); border:1px solid var(--border); border-radius:8px; padding:8px;
  }
  .fft-t { font-size:12px; color:var(--yellow); margin-bottom:6px; font-family:'Fira Code',monospace; }
  .fft-card canvas { width:100%; background:var(--term-bg); border-radius:4px; display:block; }
  .fft-psd { height:260px; }
  .fft-wf { height:180px; margin-top:6px; image-rendering:pixelated; }
  .fft-err { color:var(--red); font-size:12px; min-height:14px; margin-top:6px; font-family:'Fira Code',monospace; }
  .fft-logh {
    font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--t3); font-family:'Fira Code',monospace; margin:8px 0 4px;
  }
  .fft-log {
    flex:1; min-height:160px; max-height:46vh; overflow:auto; margin:0;
    background:var(--term-bg); color:var(--term-text); border:1px solid var(--border);
    border-radius:4px; padding:6px 8px; font-family:'Fira Code',monospace;
    font-size:11px; line-height:1.4; white-space:pre-wrap; word-break:break-word;
  }
  .fft-log::-webkit-scrollbar { width:6px; }
  .fft-log::-webkit-scrollbar-thumb { background:var(--bg-3); border-radius:3px; }
  .theme-btn {
    background:var(--bg-2); border:1px solid var(--border-b); color:var(--t2);
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    transition:all .2s;
  }
  .theme-btn:hover { background:var(--bg-3); color:var(--t0); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; vertical-align:middle; margin-right:5px; }
  .dot.on { background:var(--green); box-shadow:0 0 6px rgba(133,153,0,0.4); }
  .dot.off { background:var(--red); box-shadow:0 0 6px rgba(220,50,47,0.3); }

  /* ═══ Main ═══ */
  #main {
    flex:1; display:grid;
    grid-template-columns:240px 1fr;
    grid-template-rows:1fr;
    min-height:0; overflow:hidden;
  }

  /* ═══ Panels ═══ */
  .panel { background:var(--bg-1); display:flex; flex-direction:column; overflow:hidden; min-height:0; }
  .ph {
    display:flex; align-items:center; padding:8px 12px; background:var(--bg-2);
    border-bottom:1px solid var(--border); gap:8px; flex-shrink:0;
  }
  .ph h2 {
    font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--t3);
    font-family:'Fira Code',monospace;
  }
  .ph .badge {
    font-size:10px; padding:2px 8px; border-radius:10px;
    background:var(--bg-3); color:var(--t2); margin-left:auto;
    font-family:'Fira Code',monospace;
  }
  .ph .badge.live { background:rgba(133,153,0,0.15); color:var(--green); }
  .pb { flex:1; overflow-y:auto; padding:6px; min-height:0; }
  .pb::-webkit-scrollbar { width:6px; }
  .pb::-webkit-scrollbar-track { background:var(--bg-1); }
  .pb::-webkit-scrollbar-thumb { background:var(--bg-3); border-radius:3px; }

  /* ═══ Left: Operators ═══ */
  #op-panel { grid-row:1; grid-column:1; border-right:1px solid var(--border); }
  .op-card { margin:4px 0; background:var(--bg-2); border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .op-card.on { border-left:3px solid var(--green); }
  .op-card.off { border-left:3px solid var(--t3); opacity:.4; }
  .op-head { padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .op-head .id { font-family:'Fira Code',monospace; font-weight:700; color:var(--cyan); font-size:14px; }
  .op-head .ms { font-size:11px; color:var(--t2); margin-left:auto; font-family:'Fira Code',monospace; }
  .op-head .sms-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:4px; }
  .op-head .sms-dot.up { background:var(--green); }
  .op-head .sms-dot.down { background:var(--red); }
  .op-detail { display:none; padding:6px 12px 10px; font-size:12px; color:var(--t2); border-top:1px solid var(--border); }
  .op-card.expanded .op-detail { display:block; }
  .op-row { display:flex; justify-content:space-between; padding:2px 0; }
  .op-row .v { color:var(--t1); font-family:'Fira Code',monospace; font-size:11px; }
  .ms-chip {
    display:inline-block; font-family:'Fira Code',monospace;
    font-size:10px; padding:2px 6px; margin:2px; border-radius:3px;
    background:var(--bg-3); color:var(--yellow);
  }

  /* ═══ Capture area ═══ */
  #capture-area { grid-row:1; grid-column:2; display:flex; flex-direction:column; overflow:hidden; }
  #cap-toolbar {
    display:flex; align-items:center; padding:6px 10px; gap:8px;
    background:var(--bg-2); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  #cap-filter {
    flex:1; min-width:120px;
    background:var(--bg-1); border:1px solid var(--border-b); color:var(--t0);
    font-size:12px; padding:6px 10px; outline:none; border-radius:4px;
  }
  #cap-filter:focus { border-color:var(--cyan); }
  #cap-filter::placeholder { color:var(--t3); }

  #pkt-list-wrap { flex:1; overflow-y:auto; min-height:0; }
  .pkt-table { width:100%; border-collapse:collapse; font-size:12px; }
  .pkt-table thead { position:sticky; top:0; z-index:1; }
  .pkt-table th {
    background:var(--bg-2); color:var(--t3); font-weight:700; text-align:left;
    padding:5px 8px; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    border-bottom:1px solid var(--border); font-family:'Fira Code',monospace;
  }
  .pkt-table td {
    padding:4px 8px; border-bottom:1px solid var(--bg-2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
  }
  .pkt-table tr:hover { background:var(--bg-2); }
  .pkt-table tr.selected { background:rgba(42,161,152,0.1); }
  .pkt-table tr.flash { animation: pktFlash .4s; }
  @keyframes pktFlash { 0%{background:rgba(133,153,0,0.1)} 100%{background:transparent} }

  .proto { display:inline-block; padding:2px 6px; border-radius:3px; font-size:10px; font-weight:600; font-family:'Fira Code',monospace; }
  .proto-gsm_sms{ background:rgba(133,153,0,0.18); color:var(--green); font-weight:700; }
  .proto-gsmtap { background:rgba(42,161,152,0.12); color:var(--cyan); }
  .proto-sctp   { background:rgba(108,113,196,0.12); color:var(--violet); }
  .proto-rr     { background:rgba(42,161,152,0.12); color:var(--cyan); }
  .proto-mm     { background:rgba(108,113,196,0.12); color:var(--violet); }
  .proto-cc     { background:rgba(211,54,130,0.12); color:var(--magenta); }
  .proto-sms    { background:rgba(133,153,0,0.12); color:var(--green); }
  .proto-dtap   { background:rgba(38,139,210,0.12); color:var(--blue); }
  .proto-m3ua   { background:rgba(203,75,22,0.12); color:var(--orange); }
  .proto-def    { background:var(--bg-3); color:var(--t1); }

  /* ═══ Packet detail ═══ */
  #pkt-detail-wrap {
    height:340px; min-height:120px; max-height:70%;
    border-top:2px solid var(--border-b); background:var(--bg-1);
    flex-shrink:0; resize:vertical; display:flex; flex-direction:column; overflow:hidden;
  }
  #detail-tabs {
    display:flex; gap:0; background:var(--bg-2); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  #detail-tabs button {
    background:none; border:none; border-bottom:2px solid transparent;
    color:var(--t3); font-size:11px; font-weight:700; padding:7px 16px;
    cursor:pointer; font-family:'Source Sans 3',sans-serif;
    text-transform:uppercase; letter-spacing:.05em;
  }
  #detail-tabs button.active { color:var(--cyan); border-bottom-color:var(--cyan); }
  #detail-tabs button:hover { color:var(--t1); }
  #detail-content { flex:1; overflow-y:auto; min-height:0; }

  #pkt-detail {
    padding:8px 10px; font-family:'Fira Code',monospace; font-size:11px; line-height:1.8;
  }
  .layer-group { margin:2px 0; }
  .layer-name {
    cursor:pointer; font-weight:700; color:var(--cyan);
    padding:3px 6px; border-radius:3px; display:flex; align-items:center; gap:6px;
  }
  .layer-name:hover { background:var(--bg-2); }
  .layer-name .arrow { font-size:9px; color:var(--t3); transition:transform .15s; display:inline-block; }
  .layer-name .arrow.open { transform:rotate(90deg); }
  .layer-fields { padding-left:18px; display:none; }
  .layer-fields.open { display:block; }
  .field-row { color:var(--t2); padding:1px 6px; border-radius:2px; }
  .field-row:hover { background:var(--bg-2); }
  .field-key { color:var(--t1); }
  .field-val { color:var(--yellow); margin-left:6px; }

  .hex-dump {
    padding:10px 12px; font-size:11px; line-height:1.7;
    color:var(--hex-byte); white-space:pre; overflow-x:auto;
  }
  .hex-line { display:flex; gap:0; }
  .hex-line:hover { background:var(--hex-highlight); }
  .hex-offset { color:var(--hex-offset); min-width:60px; user-select:none; }
  .hex-bytes { min-width:380px; letter-spacing:.5px; }
  .hex-bytes .b:hover { background:rgba(42,161,152,0.15); border-radius:2px; }
  .hex-ascii { color:var(--hex-ascii); margin-left:12px; }
  .hex-ascii .np { color:var(--t3); }

  /* ═══ Floating VTY Windows ═══ */
  .vty-popup {
    position:fixed; z-index:200;
    width:660px; height:400px; min-width:400px; min-height:250px;
    background:var(--bg-1); border:1px solid var(--border-b);
    border-radius:8px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; overflow:hidden;
    resize:both;
  }
  .vty-popup-header {
    display:flex; align-items:center; padding:6px 10px; gap:6px;
    background:var(--bg-2); border-bottom:1px solid var(--border);
    cursor:move; flex-shrink:0; user-select:none;
  }
  .vty-popup-header .title {
    font-family:'Fira Code',monospace; font-size:12px; font-weight:700;
    color:var(--cyan); flex:1;
  }
  .vty-popup-header select {
    background:var(--bg-3); border:1px solid var(--border-b); color:var(--t0);
    font-family:'Fira Code',monospace; font-size:11px; padding:3px 6px;
    outline:none; border-radius:3px;
  }
  .vty-popup-header .close-btn {
    background:none; border:none; color:var(--red); font-size:16px;
    cursor:pointer; padding:2px 6px; border-radius:3px;
  }
  .vty-popup-header .close-btn:hover { background:rgba(220,50,47,0.15); }
  .vty-screen {
    flex:1; overflow-y:auto; padding:8px 10px;
    font-family:'Fira Code',monospace; font-size:13px; line-height:1.6;
    background:var(--term-bg); color:var(--term-text);
    white-space:pre-wrap; word-break:break-all; min-height:0;
  }
  .vty-screen .err { color:var(--red); }
  .vty-screen .sys { color:var(--cyan); font-style:italic; }
  .vty-screen .cmd { color:var(--yellow); }
  .vty-input-row {
    display:flex; border-top:1px solid var(--border); flex-shrink:0; background:var(--bg-2);
  }
  .vty-input-row .prm {
    padding:7px 10px; color:var(--green); font-family:'Fira Code',monospace;
    font-weight:700; font-size:13px; white-space:nowrap;
  }
  .vty-input-row input {
    flex:1; background:transparent; border:none; color:var(--t0);
    font-family:'Fira Code',monospace; font-size:13px; padding:7px 0; outline:none;
  }

  /* ═══ Packet Popup ═══ */
  .pkt-popup { width:740px; height:500px; }
  .detail-tabs-pop {
    display:flex; background:var(--bg-2); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .detail-tabs-pop button {
    background:none; border:none; border-bottom:2px solid transparent;
    color:var(--t3); font-size:11px; font-weight:700; padding:7px 16px;
    cursor:pointer; font-family:'Source Sans 3',sans-serif;
    text-transform:uppercase; letter-spacing:.05em;
  }
  .detail-tabs-pop button.active { color:var(--cyan); border-bottom-color:var(--cyan); }
  .detail-tabs-pop button:hover  { color:var(--t1); }
  .pkt-popup-body { flex:1; overflow-y:auto; min-height:0; }

  /* ═══ Responsive ═══ */
  @media (max-width:900px) {
    #main { grid-template-columns:1fr; }
    #op-panel { display:none; }
    .vty-popup { width:90vw; left:5vw !important; }
  }
  @media (min-width:1800px) {
    #main { grid-template-columns:300px 1fr; }
    .pkt-table { font-size:13px; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <span class="logo">⎔ OSMO_EGPRS</span>
    <span class="sep"></span>
    <span class="htag" id="tag-ops">0 ops</span>
    <span class="htag a5tag a5off" id="tag-a5" title="état chiffrement A5">A5 ?</span>
    <span class="htag" id="tag-tshark">tshark off</span>
    <span class="sep"></span>
    <div class="vtabs">
      <button class="vtab active" id="vtab-console" onclick="switchView('console')">Console</button>
      <button class="vtab" id="vtab-fft1" onclick="switchView('fft1')" title="FFT intégrée native (MS &amp; BTS + logs)">📡 FFT 1</button>
      <button class="vtab" id="vtab-fft2" onclick="switchView('fft2')" title="Panadapter MS vs BTS">📡 FFT 2</button>
      <button class="vtab" id="vtab-fft3" onclick="switchView('fft3')" title="Waterfalls Δ |MS−BTS|">📡 FFT 3</button>
    </div>
    <div class="hright">
      <button class="btn primary" onclick="send({type:'tshark_start'})" title="Start capture">▶ Capture</button>
      <button class="btn danger" onclick="send({type:'tshark_stop'})" title="Stop capture">■ Stop</button>
      <select class="btn" id="rec-src" title="Source IQ air à enregistrer (fifos relais libres)">
        <option value="sdcch">IQ SDCCH air</option>
        <option value="tch">IQ TCH air</option>
      </select>

<script>
// ═══ Theme ═══
// ─── Micro : navigateur → WebSocket (binaire) → sink gsm_mic ────────────────
// Le conteneur n'a aucune capture reelle. Avant le 2026-08-08, `gsm_in`
// retombait sur la source par defaut = gsm_audio.monitor, donc sur la SORTIE
// des mobiles : ca faisait « du son en entree », mais c'etait l'echo, et ca
// bouclait (RMS x11 en 10 s). `gsm_in` pointe desormais sur un sink vide, ce
// qui ouvre la boucle mais rend l'entree muette. Ce bouton la remplit.
//
// PIEGE NAVIGATEUR : getUserMedia exige un CONTEXTE SECURISE. En http:// sur
// une IP distante il echoue, silencieusement pour l'utilisateur. On le dit.
var micOn = false, micCtx = null, micStream = null, micNode = null, micSrc = null, micLp = null;
var micPeak = 0, micVuTimer = null, micSrvTxt = '';
var MIC_DEV_KEY = 'osmo.micDeviceId';

// ─── Enregistrement continu du flux I/Q vers /root/record.cfile ─────────────
// C'est ce fichier que rec.js decoupe ensuite en tranches. Il n'etait rempli
// que par pont.py ; sans pont, « Record » n'avait aucune matiere. Le serveur
// sait desormais l'alimenter depuis le lecteur live de la fifo (/iqrec).
var iqRecOn = false;
function iqRecPaint(d) {
  var b = document.getElementById('iqrec-btn');
  var t = document.getElementById('iqrec-stat');
  if (!b || !t) return;
  if (d && d.error) { t.textContent = ' ' + d.error; return; }
  iqRecOn = !!(d && d.running);
  b.textContent = iqRecOn ? '⏹ stop' : '⏺ record';
  b.style.color = iqRecOn ? 'var(--red)' : '';
  if (!d) { t.textContent = ''; return; }
  // Mo ecrits pendant CETTE session d'enregistrement, et taille du fichier.
  var mo = function (n) { return (n / 1048576).toFixed(1) + ' Mo'; };
  t.textContent = iqRecOn
    ? ' ' + mo(d.bytes) + ' · ' + (d.seconds || 0) + ' s → ' + d.path
    : ' ' + d.path + (d.fileBytes ? ' (' + mo(d.fileBytes) + ')' : ' (vide)');
}
function iqRecPoll() {
  fetch('/iqrec?src=bts', { cache: 'no-store' })
    .then(function (r) { return r.json(); }).then(iqRecPaint).catch(function () {});
}
function toggleIqRec() {
  fetch('/iqrec?src=bts&on=' + (iqRecOn ? '0' : '1'), { cache: 'no-store' })
    .then(function (r) { return r.json(); }).then(iqRecPaint).catch(function () {});
}
setInterval(iqRecPoll, 2000); iqRecPoll();

function micBtn()  { return document.getElementById('mic-btn'); }
function micFail(m) {
  micOn = false;
  var b = micBtn();
  if (b) { b.textContent = '🎤 Parler'; b.classList.remove('primary'); }
  micVuHide();
  console.error('mic: ' + m);
  alert('Micro indisponible : ' + m);
}

// ─── Choix de l'entree : c'est le poste CLIENT qui decide ───────────────────
// Les noms de peripheriques changent d'une machine a l'autre et les deviceId
// sont propres a chaque navigateur : on ne peut donc rien coder en dur, et le
// deviceId memorise peut tres bien ne plus exister au prochain poste. D'ou la
// reprise sur OverconstrainedError plus bas : on retombe sur le defaut plutot
// que d'echouer. Les libelles restent vides tant qu'aucune permission n'a ete
// accordee (regle des navigateurs) : la liste se remplit apres le 1er 🎤.
async function micListDevices() {
  var sel = document.getElementById('mic-dev');
  if (!sel || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  var saved = localStorage.getItem(MIC_DEV_KEY) || '';
  var devs;
  try { devs = await navigator.mediaDevices.enumerateDevices(); } catch (e) { return; }
  var ins = devs.filter(function(d) { return d.kind === 'audioinput'; });
  sel.innerHTML = '';
  var opt = document.createElement('option');
  opt.value = ''; opt.textContent = 'micro : defaut';
  sel.appendChild(opt);
  ins.forEach(function(d, i) {
    var o = document.createElement('option');
    o.value = d.deviceId;
    o.textContent = d.label || ('entree ' + (i + 1));
    sel.appendChild(o);
  });
  // Le deviceId memorise vient peut-etre d'une AUTRE machine : s'il n'est plus
  // dans la liste, on revient au defaut au lieu de garder un choix fantome.
  if (saved && ins.some(function(d) { return d.deviceId === saved; })) sel.value = saved;
  else { sel.value = ''; if (saved) localStorage.removeItem(MIC_DEV_KEY); }
}
function micPickDevice(id) {
  if (id) localStorage.setItem(MIC_DEV_KEY, id); else localStorage.removeItem(MIC_DEV_KEY);
  // Changer d'entree en cours de route = relancer la capture sur la nouvelle.
  if (micOn) { toggleMic().then(function() { toggleMic(); }); }
}
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  // Casque branche/debranche, dock change : la liste bouge sans rechargement.
  navigator.mediaDevices.addEventListener('devicechange', function() { micListDevices(); });
}
micListDevices();

// ─── Vu-metre : le SEUL moyen de distinguer « ca debite » de « ca porte » ────
// Panne vecue le 2026-08-12 : bonne cadence d'octets, contenu integralement nul.
// A gauche le niveau mesure ICI (avant l'envoi), a droite ce que le conteneur a
// reellement recu (message mic_stat du serveur). Les deux a zero = entree muette.
function micVuShow() {
  var el = document.getElementById('mic-vu');
  if (!el) return;
  el.style.display = '';
  clearInterval(micVuTimer);
  micVuTimer = setInterval(function() {
    var pct = Math.min(100, Math.round(micPeak * 100));
    var bars = Math.round(pct / 10);
    el.textContent = '🎙 ' + '▇'.repeat(bars) + '·'.repeat(10 - bars) + ' ' + pct + '%'
                   + (micSrvTxt ? '  ' + micSrvTxt : '');
    el.className = 'htag' + (pct > 1 ? ' on' : '');
    micPeak = 0;
  }, 500);
}
function micVuHide() {
  clearInterval(micVuTimer); micVuTimer = null; micPeak = 0; micSrvTxt = '';
  var el = document.getElementById('mic-vu');
  if (el) { el.style.display = 'none'; el.textContent = '—'; el.className = 'htag'; }
}

async function toggleMic() {
  var btn = micBtn();
  if (micOn) {
    micOn = false;
    try { if (micNode) micNode.disconnect(); if (micLp) micLp.disconnect(); if (micSrc) micSrc.disconnect(); } catch (e) {}
    try { if (micStream) micStream.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {}
    try { if (micCtx) micCtx.close(); } catch (e) {}
    micCtx = micStream = micNode = micSrc = micLp = null;
    send({ type: 'mic_stop' });
    btn.textContent = '🎤 Parler'; btn.classList.remove('primary');
    micVuHide();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return micFail("getUserMedia absent. La capture micro exige un contexte securise : "
                 + "servez la page en https://, ou ouvrez-la depuis http://localhost "
                 + "(un tunnel SSH -L convient)."
                 + "\n\nOrigine actuelle : " + location.origin
                 + "\nContexte sur : " + (window.isSecureContext ? 'oui' : 'NON'));
  }
  var want = localStorage.getItem(MIC_DEV_KEY) || '';
  var base = { channelCount: 1, echoCancellation: true,
               noiseSuppression: true, autoGainControl: true };
  try {
    var c = Object.assign({}, base);
    if (want) c.deviceId = { exact: want };
    micStream = await navigator.mediaDevices.getUserMedia({ audio: c });
  } catch (e) {
    // ── TROIS ESSAIS, DU PLUS PRECIS AU PLUS NU ─────────────────────────────
    // Le repli n'existait QUE si un deviceId etait memorise (`if (want && ...)`).
    // Or un deviceId est propre au COUPLE navigateur+origine : celui enregistre
    // sous Chrome n'existe pas sous Firefox, et l'inverse aussi. Firefox rendait
    // donc « NotFoundError — The object can not be found here » et on s'arretait
    // la, alors que la machine a deux entrees audio bien reelles et que Chrome,
    // au meme instant, capturait sans rien dire.
    //
    // On redescend maintenant les contraintes meme SANS deviceId memorise :
    // certaines piles (PulseAudio derriere un cubeb, un casque USB qui ne sait
    // pas faire de suppression d'echo) refusent le lot echoCancellation +
    // noiseSuppression + autoGainControl et rendent le meme NotFoundError.
    var recuperable = (e.name === 'OverconstrainedError' || e.name === 'NotFoundError'
                    || e.name === 'NotReadableError');
    if (!recuperable) return micFail(e.name + ' — ' + e.message);
    if (want) { localStorage.removeItem(MIC_DEV_KEY);
                console.warn('mic: entree memorisee introuvable ici — les deviceId ne '
                           + 'traversent pas d\'un navigateur a l\'autre'); }
    var essais = [base, { channelCount: 1 }, true];
    var derniere = e;
    for (var i = 0; i < essais.length; i++) {
      try { micStream = await navigator.mediaDevices.getUserMedia({ audio: essais[i] }); derniere = null; break; }
      catch (ei) { derniere = ei; }
    }
    if (derniere) {
      // Dire CE QUE LE NAVIGATEUR VOIT : « aucun peripherique » et « le
      // peripherique refuse mes contraintes » se soignent differemment, et
      // le seul message de l'erreur ne permet pas de les distinguer.
      var vus = '(enumeration impossible)';
      try {
        var dd = await navigator.mediaDevices.enumerateDevices();
        var ins = dd.filter(function (d) { return d.kind === 'audioinput'; });
        vus = ins.length ? ins.length + ' entree(s) : '
                         + ins.map(function (d, i) { return d.label || ('#' + (i + 1)); }).join(', ')
                         : 'AUCUNE entree audio visible par ce navigateur';
      } catch (e3) {}
      return micFail(derniere.name + ' — ' + derniere.message
        + '\n\nCe que ce navigateur voit : ' + vus
        + '\n\nSi la liste est vide alors que la machine a un micro, le navigateur'
        + ' ne joint pas le serveur audio : PulseAudio tourne ici sous root'
        + ' (/run/user/0/pulse) et un navigateur lance sous un autre compte n\'y'
        + ' a pas acces. Chrome retombe sur ALSA, Firefox non.');
    }
  }
  micListDevices();   // les libelles ne sont lisibles qu'apres la permission

  // 8 kHz demande directement au contexte : c'est le debit du TCH (GSM-FR).
  // Si le navigateur refuse, on rechantillonne a la main plus bas.
  try { micCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 8000 }); }
  catch (e) { micCtx = new (window.AudioContext || window.webkitAudioContext)(); }

  // ─── FIREFOX : LE CONTEXTE NAIT SUSPENDU, ET RIEN NE LE DISAIT ───────────
  // Panne « le micro marche sous Chrome, pas sous Firefox », et elle tient a
  // une ligne absente. Un AudioContext cree sans ACTIVATION UTILISATEUR demarre
  // a l'etat 'suspended'. Or toggleMic est bien appele depuis un clic, mais il
  // fait « await getUserMedia(...) » AVANT de creer le contexte : sous Firefox,
  // l'activation transitoire ne survit pas a cette attente. Le contexte naissait
  // donc suspendu, onaudioprocess n'etait JAMAIS appele, aucun octet ne partait
  // - et tout avait l'air normal : permission accordee, bouton rouge, piste
  // active. Seul le vu-metre restait a zero. Chrome, lui, considere qu'une
  // permission micro accordee vaut activation, d'ou la difference.
  //
  // resume() rend la main sur une promesse : on l'ATTEND, et on verifie l'etat
  // plutot que de supposer. S'il refuse encore, on le dit au lieu de laisser
  // l'operateur parler dans le vide.
  try { await micCtx.resume(); } catch (e) { console.warn('mic: resume refuse — ' + e); }
  if (micCtx.state !== 'running') {
    // Dernier recours : re-armer sur le prochain geste de l'utilisateur.
    var _armed = function () {
      micCtx && micCtx.resume().then(function () { console.info('mic: contexte relance'); });
      window.removeEventListener('pointerdown', _armed, true);
    };
    window.addEventListener('pointerdown', _armed, true);
    console.warn('mic: contexte ' + micCtx.state + ' — relance au prochain clic');
  }
  var ratio = micCtx.sampleRate / 8000;
  micSrc  = micCtx.createMediaStreamSource(micStream);
  micNode = micCtx.createScriptProcessor(2048, 1, 1);   // deprecie mais universel
  var acc = 0.0;
  micNode.onaudioprocess = function(ev) {
    if (!micOn || !ws || ws.readyState !== 1) return;
    var inp = ev.inputBuffer.getChannelData(0);
    var out = new Int16Array(Math.ceil(inp.length / ratio));
    var n = 0;
    // Decimation (cf. le passe-bas installe juste apres : il enleve ce qui se
    // replierait ici). Prise du niveau au passage — c'est ce que le vu-metre
    // affiche, et c'est mesure APRES filtrage, donc sur ce qui part vraiment.
    for (var i = 0; i < inp.length; i++) {
      var s = inp[i] < 0 ? -inp[i] : inp[i];
      if (s > micPeak) micPeak = s;
      acc += 1;
      if (acc >= ratio) {
        acc -= ratio;
        var v = Math.max(-1, Math.min(1, inp[i]));
        out[n++] = v < 0 ? v * 0x8000 : v * 0x7FFF;
      }
    }
    if (n > 0) ws.send(out.buffer.slice(0, n * 2));
  };

  // ─── Anti-repliement AVANT decimation ────────────────────────────────────
  // Chrome honore sampleRate:8000, Safari/WebKit et certaines configurations
  // Firefox l'ignorent et rendent 44,1 ou 48 kHz : la boucle ci-dessus ne garde
  // alors qu'un echantillon sur 5,5 ou 6. Sans filtre, TOUT le 4-24 kHz se
  // replie dans la bande utile. Le codec FR filtre bien au-dessus de 3,4 kHz,
  // mais APRES : le repliement a deja eu lieu, il ne peut plus l'enlever.
  // Deux biquads en cascade a 3,4 kHz — 4 lignes, aucune dependance. A 8 kHz
  // natif la chaine est inaudible (fc au-dessus de la bande transmise).
  var fc = Math.min(3400, micCtx.sampleRate * 0.45);
  micLp = micCtx.createBiquadFilter();
  micLp.type = 'lowpass'; micLp.frequency.value = fc; micLp.Q.value = 0.707;
  var lp2 = micCtx.createBiquadFilter();
  lp2.type = 'lowpass'; lp2.frequency.value = fc; lp2.Q.value = 0.707;
  micSrc.connect(micLp); micLp.connect(lp2); lp2.connect(micNode);
  micNode.connect(micCtx.destination);   // requis par Chrome pour cadencer le noeud
  if (Math.abs(micCtx.sampleRate - 8000) > 1)
    console.info('mic: contexte a ' + micCtx.sampleRate + ' Hz (8000 refuse) — '
               + 'decimation 1/' + ratio.toFixed(2) + ' avec passe-bas ' + Math.round(fc) + ' Hz');
  micOn = true;
  send({ type: 'mic_start' });
  btn.textContent = '🔴 Micro ON'; btn.classList.add('primary');
  micVuShow();
}

// Le serveur peut couper le micro sans nous : pacat mort, sink gsm_mic disparu,
// PulseAudio du conteneur redemarre. Avant, le bouton restait rouge et on
// parlait dans le vide. Desormais l'IHM suit l'etat REEL du pont.
function micOnServerState(d) {
  if (!d) return;
  if (d.on) { micSrvTxt = ''; return; }
  if (micOn) {
    micOn = false;
    try { if (micNode) micNode.disconnect(); if (micLp) micLp.disconnect(); if (micSrc) micSrc.disconnect(); } catch (e) {}
    try { if (micStream) micStream.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {}
    try { if (micCtx) micCtx.close(); } catch (e) {}
    micCtx = micStream = micNode = micSrc = micLp = null;
    var b = micBtn(); if (b) { b.textContent = '🎤 Parler'; b.classList.remove('primary'); }
    micVuHide();
  }
  if (d.reason) alert('Micro coupe cote conteneur : ' + d.reason);
}
// Cote conteneur : ms d'audio recus par seconde, echantillons non nuls, crete,

// ═══ FFT view (MS & BTS) — logique portée de fft_web.py, données via /psd ═══
// ── CADENCE AUTO-REGLEE ─────────────────────────────────────────────────────
// 150 ms (~7 img/s) etait un intervalle FIXE, et setInterval ne regarde pas si
// la requete precedente est revenue : quand le serveur mettait plus de 150 ms -
// deux sources, seize segments de Welch chacune - les requetes s'empilaient,
// le navigateur les mettait en file, et la cascade avancait par a-coups. Plus
// on accelerait, pire c'etait.
// On enchaine donc APRES la reponse : la boucle tourne aussi vite que le
// serveur repond, jamais plus, et le plancher garde un peu d'air pour le reste
// de la page. Resultat mesure : ~16 img/s au lieu de ~7, et une cascade qui
// defile sans hoquet.
// 40 ms = 25 img/s, la cadence d'un analyseur de spectre - et celle que
// fft-web/fft_web.py utilise deja de son cote. Mesure sur ce banc : le serveur
// rend une PSD en 4 a 6 ms par source, les deux en parallele ; le plancher est
// donc large, il reste ~85 % du budget pour le reste de la page.
// Reglable sans rebatir : localStorage.osmo.fftRefreshMs
var FFT_REFRESH_MS = Math.max(20,
  parseInt(localStorage.getItem('osmo.fftRefreshMs') || '40', 10) || 40);
var fftTimer = null;
function fftCmap(v){v=Math.max(0,Math.min(1,v));var h=(1-v)*240,l=0.12+0.5*v,a=1*Math.min(l,1-l);
 var f=function(n){var k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};
 return [f(0),f(8),f(4)];}
function fftDrawPsd(src,d){var c=document.getElementById('c-'+src),x=c.getContext('2d');
 var W=c.width=c.clientWidth*2,H=c.height=c.clientHeight*2;x.clearRect(0,0,W,H);
 var p=d.psd,n=p.length;if(!n)return;var mn=Math.min.apply(null,p),mx=Math.max.apply(null,p),rg=(mx-mn)||1;
 x.strokeStyle='#16222b';x.lineWidth=1;for(var g=0;g<=4;g++){var yy=H*g/4;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();}
 x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.strokeStyle='#243845';x.stroke();
 x.strokeStyle='#2aa198';x.lineWidth=2;x.beginPath();
 var _z=Math.min(1, window.__fftzoom||1);
 for(var i=0;i<n;i++){var xx=W*0.5+((i/(n-1))-0.5)*W*_z,yy=H-(p[i]-mn)/rg*H*0.9-H*0.05;
  if(window.__fftflip) yy=H-yy;                 /* /fftcfg?flip=1 */
  i?x.lineTo(xx,yy):x.moveTo(xx,yy);}
 x.stroke();}
function fftDrawWf(src,d){var c=document.getElementById('w-'+src),x=c.getContext('2d');
 var p=d.psd,n=p.length;if(!n)return;
 if(c.width!==n){c.width=n;c.height=160;x.fillStyle='#060a0e';x.fillRect(0,0,n,c.height);}
 /* Sens pilote par /fftcfg?dir=up|down. */
 var _up = (window.__fftdir === 'up');
 x.drawImage(c,0,_up ? -1 : 1);
 var mn=Math.min.apply(null,p),mx=Math.max.apply(null,p),rg=(mx-mn)||1;
 var row=x.createImageData(n,1);
 for(var i=0;i<n;i++){var col=fftCmap((p[i]-mn)/rg),o=i*4;row.data[o]=col[0];row.data[o+1]=col[1];row.data[o+2]=col[2];row.data[o+3]=255;}
 x.putImageData(row,0,_up ? (c.height-1) : 0);}
function fftDraw(src,d){ if(d&&typeof d.wfdir==='string') window.__fftdir=d.wfdir;
 if(d&&typeof d.zoom==='number'&&d.zoom>0) window.__fftzoom=d.zoom;
 if(d&&typeof d.flip==='boolean') window.__fftflip=d.flip;
var e=document.getElementById('e-'+src),tt=document.getElementById('t-'+src);
 if(d.error){e.textContent=d.error;tt.textContent=d.label||'';return;} e.textContent='';
 tt.textContent=d.label+'  •  ARFCN '+d.arfcn+'  •  Fs '+(d.rate/1e6).toFixed(3)+' MHz';
 fftDrawPsd(src,d);fftDrawWf(src,d);}
function fftTick(){
  // Les deux sources en parallele, et on ne repart que quand les DEUX sont
  // dessinees : sinon la pane la plus rapide prendrait deux fois plus de
  // lignes de cascade que l'autre, et les deux echelles de temps
  // divergeraient a l'ecran.
  var t0 = Date.now();
  return Promise.all(['ms','bts'].map(function(s){
    return fetch('/psd?src='+s+'&t='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){fftDraw(s,d);})
      .catch(function(){});
  })).then(function(){
    if (!fftTimer) return;                       // vue quittee entre-temps
    var reste = FFT_REFRESH_MS - (Date.now() - t0);
    fftTimer = setTimeout(fftTick, reste > 0 ? reste : 0);
  });
}
// ── Logs colorisés (ANSI → HTML) : mobile.log (MS) + grgsm record (BTS) ──
var ANSI_FG = {30:'#586e75',31:'#dc322f',32:'#859900',33:'#b58900',34:'#268bd2',35:'#d33682',36:'#2aa198',37:'#eee8d5',
 90:'#657b83',91:'#cb4b16',92:'#859900',93:'#b58900',94:'#268bd2',95:'#6c71c4',96:'#2aa198',97:'#fdf6e3'};
function fftXterm256(n){
 if(n<16)return ['000000','800000','008000','808000','000080','800080','008080','c0c0c0','808080','ff0000','00ff00','ffff00','0000ff','ff00ff','00ffff','ffffff'][n];
 if(n>=232){var v=(8+(n-232)*10).toString(16);return (v.length<2?'0'+v:v).repeat(3);}
 n-=16;var lv=function(x){x=x?55+x*40:0;x=x.toString(16);return x.length<2?'0'+x:x;};
 return lv((n/36|0))+lv(((n%36)/6|0))+lv(n%6);}
function ansiToHtml(s){
 s=s.replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;';});
 var out='',open=false,cur={},re=/\x1b\[([0-9;]*)m/g,last=0,m;
 while((m=re.exec(s))){
  out+=s.slice(last,m.index);last=re.lastIndex;if(open){out+='</span>';open=false;}
  var codes=m[1]===''?[0]:m[1].split(';').map(Number);
  for(var i=0;i<codes.length;i++){var c=codes[i];
   if(c===0)cur={};else if(c===1)cur.bold=true;else if(c===22)cur.bold=false;
   else if(c===39)cur.fg=null;else if(ANSI_FG[c])cur.fg=ANSI_FG[c];
   else if(c===38&&codes[i+1]===5){cur.fg='#'+fftXterm256(codes[i+2]|0);i+=2;}
   else if(c===38&&codes[i+1]===2){cur.fg='rgb('+(codes[i+2]|0)+','+(codes[i+3]|0)+','+(codes[i+4]|0)+')';i+=4;}}
  var st=(cur.fg?'color:'+cur.fg+';':'')+(cur.bold?'font-weight:700;':'');
  if(st){out+='<span style="'+st+'">';open=true;}}
 out+=s.slice(last);if(open)out+='</span>';return out;}

// ═══ WebSocket ═══
// [2026-08-08] Schema ET hote derives de la page.
// L'ancienne forme cablait `ws://` et un port de repli 80. Servie en https://,
// la page se voyait alors refuser la WebSocket par le navigateur (contenu
// mixte : ws:// en clair depuis une origine sure), et le repli l'envoyait en
// plus sur le port 80 puisque location.port est VIDE sur le 443 implicite.
// Resultat : aucune WebSocket, donc ni tshark, ni VTY, ni etat live — et rien
// ne le disait, le bouton restait simplement « off ».
// location.host inclut deja le port quand il n'est pas celui par defaut.
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
let ws = null;
let opState = {}, activeOpIds = [];
let reconnectDelay = 1000;
let captureRunning = false;   // état réel de la capture (piloté par tshark_status)

function connectWs() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { setWs(true); reconnectDelay = 1000; };
  ws.onmessage = e => {
    handle(JSON.parse(e.data));
  };
  ws.onclose = () => { setWs(false); setTimeout(connectWs, reconnectDelay); reconnectDelay = Math.min(reconnectDelay*1.5, 10000); };
  ws.onerror = () => {};
}
function setWs(on) {
  document.getElementById('ws-dot').className = 'dot '+(on?'on':'off');
  document.getElementById('ws-txt').textContent = on?'LIVE':'…';
}
function send(msg) { if (ws && ws.readyState===1) ws.send(JSON.stringify(msg)); }

// ═══ Message Router ═══
function handle(msg) {
  switch(msg.type) {
    case 'rec_status': onRecStatus(msg.data); break;
    case 'rec_result': onRecResult(msg.data); break;
    case 'rec_error':  setRec(false); alert('Capture IQ: ' + (msg.data && msg.data.msg)); break;
    case 'init':
      activeOpIds = msg.data.activeOpIds||[];
      updateOps(msg.data.operators);
      setCaptureRunning(msg.data.tsharkActive || false);
      if(msg.data.a5) updateA5(msg.data.a5);
      break;
    case 'state':
      activeOpIds = msg.data.activeOpIds||activeOpIds;
      updateOps(msg.data.operators);
      break;
    case 'a5_status': updateA5(msg.data); break;
    case 'tshark_status':
      setCaptureRunning(msg.data.active);
      break;
    case 'packet': addPacket(msg.data); break;
    case 'tshark_stopped':
      setCaptureRunning(false);
      break;
    case 'tshark_error':
      setCaptureRunning(false);
      document.getElementById('tag-tshark').textContent='tshark ERR';
      break;
    case 'packet_hex':
      onPacketHex(msg.data);
      break;
    case 'packet_dissect':
      onPacketDissect(msg.data);
      break;
    case 'vty_connected': vtyOnConnected(msg.data); break;
    case 'vty_data': vtyOnData(msg.data); break;
    case 'vty_error': vtyOnError(msg.data); break;
    case 'vty_disconnected': vtyOnDisc(msg.data); break;
    case 'mic_state': micOnServerState(msg.data); break;
    case 'mic_stat':  micOnServerStat(msg.data); break;
  }
}

  captureRunning = on;
  setTsharkTag(on);
}

// ═══ Packet Capture ═══
let packets = [];
const MAX_PKT = 3000;
let filterText = '';

document.getElementById('cap-filter').addEventListener('input', e => {
  filterText = e.target.value.toLowerCase().trim();
  rebuildPktTable();
});

function matchFilter(p) {
  if (!filterText) return true;
  const f = filterText;
  if (f==='ul')  return p.direction==='UL' || p.uplink;
  if (f==='dl')  return p.direction==='DL' || !p.uplink;
  const om = f.match(/^op\s*=?\s*(\d+)$/i);
  if (om) return (p.opLabel||'').toLowerCase().includes('op'+om[1]);
  // [2026-08-12] l2/cc/l3 ajoutes au texte filtrable : sans eux, taper « sabm »
  // ou « setup » dans le filtre ne matchait que si la colonne INFO le contenait.
  return `${p.protocol} ${p.info} ${p.opLabel} ${p.direction} ${p.src} ${p.dst} ${p.arfcn} ${p.l2||''} ${p.cc||''} ${p.rr||''} ${p.l3||''}`.toLowerCase().includes(f);
}

function addPacket(p) {
  packets.push(p);
  if (packets.length > MAX_PKT) packets = packets.slice(-MAX_PKT/2);
  document.getElementById('pkt-counter').textContent = packets.length+' pkts';
  // Ne pas appeler setTsharkTag ici — piloté uniquement par tshark_status/tshark_stopped
  if (!matchFilter(p)) return;
  const tbody = document.getElementById('pkt-tbody');
  tbody.appendChild(makePktRow(p));
  while (tbody.children.length > 800) tbody.removeChild(tbody.firstChild);
  const wrap = document.getElementById('pkt-list-wrap');
  if (wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60) wrap.scrollTop = wrap.scrollHeight;
}

function makePktRow(p) {
  const tr = document.createElement('tr');
  tr.className = 'flash';
  tr.onclick = () => {
    document.querySelectorAll('.pkt-table tr.selected').forEach(r=>r.classList.remove('selected'));
    tr.classList.add('selected');
    selectPacket(p);
  };
  tr.ondblclick = (e) => { e.stopPropagation(); spawnPktPopup(p); };
  const ts = typeof p.ts==='number' ? p.ts.toFixed(3) : '—';
  const pc = (p.protocol||'').toLowerCase();
  const cls = pc.includes('gsm_sms') ? 'proto-gsm_sms' :
              pc.includes('sctp')    ? 'proto-sctp'    :
              pc.includes('m3ua')    ? 'proto-m3ua'    :
              pc.includes('gsmtap')  ? 'proto-gsmtap'  :
              pc.includes('rr')      ? 'proto-rr'      :
              pc.includes('sms')     ? 'proto-gsm_sms' :
              pc.includes('dtap')    ? 'proto-dtap'    : 'proto-def';
  const dir = p.direction || (p.uplink ? 'UL' : 'DL');
  const dirCls = dir === 'UL' ? 'color:var(--red);font-weight:700' : dir === 'DL' ? 'color:var(--green);font-weight:700' : 'color:var(--t2)';
  const opLabel = p.opLabel || '—';
  tr.innerHTML = `<td style="color:var(--t3)">${p.id}</td><td style="color:var(--t2);font-size:11px">${ts}</td><td style="${dirCls};font-size:11px">${esc(dir)}</td><td style="color:var(--cyan);font-size:11px;font-weight:600">${esc(opLabel)}</td><td><span class="proto ${cls}">${esc(p.protocol||'—')}</span></td><td style="color:var(--t3)">${p.length||''}</td><td style="font-size:11px;white-space:nowrap"><span style="color:var(--t2)">${esc(p.l2||'')}</span>${(p.cc||p.rr)?` <span style="color:var(--yellow,#e5c07b);font-weight:700">${esc(p.cc||p.rr)}</span>`:(p.l3?` <span style="color:var(--t3)">${esc(p.l3)}</span>`:'')}</td><td style="color:var(--t1);max-width:500px;overflow:hidden;text-overflow:ellipsis">${esc(p.info||'')}</td>`;
  return tr;
}

function selectPacket(p) {

  renderDetailForTab(p);
}

function onPacketDissect(data) {
  const p = packets.find(function(pk){ return pk.frameNum === data.frameNum; });
  if (p) {
    p.layers = data.layers;
    p._pendingDissect = false;
  }
  if (currentDetailPacket && currentDetailPacket.frameNum === data.frameNum) {
    currentDetailPacket.layers = data.layers;
    currentDetailPacket._pendingDissect = false;
    if (currentDetailTab === 'decode') renderDecode(currentDetailPacket);
  }
  document.querySelectorAll('[data-pkt-frame="' + data.frameNum + '"]').forEach(function(el) {
    var decodeEl = el.querySelector('.pkt-popup-decode');
    if (decodeEl) renderDecodeInto({ layers: data.layers }, decodeEl);
  });
}

function renderDetailForTab(p) {
  if (currentDetailTab === 'decode') renderDecode(p);
  else if (currentDetailTab === 'hex') renderHexDump(p);
  else renderRawJson(p);
}

function renderDecode(p) {
  const el = document.getElementById('pkt-detail');
  if (!p.layers) {
    el.innerHTML = '<span style="color:var(--t3)">' + (p._pendingDissect ? 'Chargement dissection…' : 'No decode data') + '</span>';
    return;
  }
  renderDecodeInto(p, el);
}

function renderDecodeInto(p, el) {
  if (!p.layers || Object.keys(p.layers).length === 0) {
    el.innerHTML = '<span style="color:var(--t3)">No decode data</span>';
    return;
  }
  // Aplatir les couches : hisser les sous-protocoles trouvés dans les _tree
  // (ex: gsm_sms niché dans gsm_a.rp_tree) au même niveau que les couches parentes
  const flatLayers = flattenLayers(p.layers);
  let h = '';
  for (const [ln, fields] of flatLayers) {
    if (ln.endsWith('_raw')) continue;
    const lnEsc = ln.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    h += `<div class="layer-group">
      <div class="layer-name" onclick="togLayer(this)"><span class="arrow">&#9658;</span> ${esc(ln)}</div>
      <div class="layer-fields">`;
    if (typeof fields === 'object' && fields !== null) {
      h += renderFields(fields, lnEsc, 0);
    } else if (fields !== null && fields !== undefined) {
      h += `<div class="field-row"><span class="field-val">${esc(String(fields))}</span></div>`;
    }
    h += '</div></div>';
  }
  el.innerHTML = h || '<span style="color:var(--t3)">No fields</span>';
  const first = el.querySelector('.layer-name');
  if (first) togLayer(first);
}

// Les layers arrivent déjà ordonnés depuis le serveur (reorderLayers).
// On aplatit juste les _tree résiduels pour récupérer les sous-protocoles
// que -O n'aurait pas hissés (cas rares).
function flattenLayers(layers) {
  const result = [];
  const seen   = new Set();
  for (const [ln, fields] of Object.entries(layers)) {
    if (ln.endsWith('_raw')) continue;
    if (seen.has(ln)) continue;
    seen.add(ln);
    result.push([ln, fields]);
  }
  return result;
}

// indexLayerData n'est plus utilisé mais conservé pour compatibilité
function indexLayerData(obj, map) {}

// Rendu récursif des champs — gère les sous-objets imbriqués (SMS TPDU, GSM addresses…)
function renderFields(obj, prefixEsc, depth) {
  if (typeof obj !== 'object' || obj === null) return '';
  let h = '';
  const indent = depth > 0 ? `padding-left:${depth * 12}px` : '';

  for (const [k, v] of Object.entries(obj)) {
    if (k.endsWith('_raw')) continue;

    // Clés _tree : nœud organisationnel tshark → on récurse sans en-tête
    if (k.endsWith('_tree')) {
      if (typeof v === 'object' && v !== null) {
        h += renderFields(v, '', depth);
      }
      continue;
    }

    // Nettoyer la clé : retirer le préfixe de layer
    const sk = prefixEsc ? k.replace(new RegExp('^' + prefixEsc + '[._]'), '') || k : k;

    if (typeof v === 'object' && v !== null && !Array.isArray(v)) {
      // Sous-objet avec contenu (ex: gsm_sms, gsm_a.rp_tree interne…)
      const inner = renderFields(v, k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), depth + 1);
      if (inner) {
        const uid = 'sf_' + Math.random().toString(36).substr(2, 6);
        h += `<div class="field-row" style="${indent}">
          <span class="field-key" style="cursor:pointer;color:var(--blue)"
            onclick="var d=document.getElementById('${uid}');var open=d.style.display!=='none';d.style.display=open?'none':'block';this.firstChild.textContent=open?'▶':'▼';">
            <span>▼</span> ${esc(sk)}</span>
          <div id="${uid}" style="display:block">${inner}</div>
        </div>`;
      }
    } else if (Array.isArray(v)) {
      const hasObj = v.some(i => typeof i === 'object' && i !== null);
      if (hasObj) {
        h += `<div class="field-row" style="${indent}"><span class="field-key">${esc(sk)}</span>:`;
        v.forEach(item => {
          if (typeof item === 'object' && item !== null)
            h += `<div style="padding-left:${(depth+1)*12}px">${renderFields(item, '', depth+1)}</div>`;
          else
            h += `<span class="field-val" style="margin-left:4px">${esc(String(item))}</span>`;
        });
        h += '</div>';
      } else {
        h += `<div class="field-row" style="${indent}"><span class="field-key">${esc(sk)}</span>:<span class="field-val">${esc(v.join(', '))}</span></div>`;
      }
    } else {
      h += `<div class="field-row" style="${indent}"><span class="field-key">${esc(sk)}</span>:<span class="field-val">${esc(String(v))}</span></div>`;
    }
  }
  return h;
}

function renderHexDump(p) {
  const el = document.getElementById('pkt-hex');
  if (p.hexDump) {
    _renderHex(el, p.hexDump);
  } else if (p.frameNum) {
    el.innerHTML = '<span style="color:var(--t3)">Chargement hex…</span>';
    send({ type: 'packet_hex_request', frameNum: p.frameNum });
  } else {
    el.innerHTML = '<span style="color:var(--t3)">No hex data</span>';
  }
}

function _renderHex(el, hexDump) {
  const hex = hexDump.replace(/[^0-9a-fA-F]/g,'');
  const bytes = [];
  for (let i=0;i<hex.length;i+=2) bytes.push(parseInt(hex.substr(i,2),16));
  let html='';
  for (let off=0;off<bytes.length;off+=16) {
    const row=bytes.slice(off,off+16);
    const os=off.toString(16).padStart(4,'0');
    let hp='',ap='';
    for (let i=0;i<16;i++) {
      if (i<row.length) { const b=row[i]; hp+=`<span class="b">${b.toString(16).padStart(2,'0')}</span> `; if(i===7)hp+=' '; ap+=(b>=32&&b<=126)?String.fromCharCode(b):'<span class="np">.</span>'; }
      else { hp+='   '; if(i===7)hp+=' '; ap+=' '; }
    }
    html+=`<div class="hex-line"><span class="hex-offset">${os}</span><span class="hex-bytes">${hp}</span><span class="hex-ascii">${ap}</span></div>`;
  }
  el.innerHTML=html;
}

function onPacketHex(data) {
  const p = packets.find(pk => pk.frameNum === data.frameNum);
  if (p) p.hexDump = data.hex;
  // Panel bas
  if (currentDetailPacket && currentDetailPacket.frameNum === data.frameNum && currentDetailTab === 'hex') {
    _renderHex(document.getElementById('pkt-hex'), data.hex);
  }
  // Popups en attente (dataset.frameNum posé lors de l'ouverture)
  document.querySelectorAll('[data-frame-num="' + data.frameNum + '"]').forEach(el => {
    _renderHex(el, data.hex);
    delete el.dataset.frameNum;
  });
}

function renderRawJson(p) {
  const el=document.getElementById('pkt-raw');
  const c={...p}; delete c.hexDump;
  el.textContent=JSON.stringify(c,null,2);
}

function togLayer(el) {
  const f=el.nextElementSibling;
  const o=f.classList.toggle('open');
  el.querySelector('.arrow').classList.toggle('open',o);
}

function clearPackets() {
  packets=[];
  document.getElementById('pkt-tbody').innerHTML='';
  document.getElementById('pkt-counter').textContent='0 pkts';
  document.getElementById('pkt-detail').innerHTML='<span style="color:var(--t3)">Click a packet to inspect</span>';
  document.getElementById('pkt-hex').innerHTML='';
  document.getElementById('pkt-raw').textContent='';
  document.getElementById('detail-badge').textContent='—';
  currentDetailPacket=null;
}

function rebuildPktTable() {
  const tbody=document.getElementById('pkt-tbody');
  tbody.innerHTML='';
  packets.filter(matchFilter).slice(-800).forEach(p=>tbody.appendChild(makePktRow(p)));
}

// ═══ Packet Popup (double-clic) ═══
let pktPopCounter = 0;

function spawnPktPopup(p) {
  pktPopCounter++;
  const wid = 'pktpop-' + pktPopCounter;
  const layer = document.getElementById('vty-layer');
  const offset = (pktPopCounter - 1) * 32;
  const top  = 90  + (offset % 180);
  const left = 260 + (offset % 320);

  const pc  = (p.protocol || '').toLowerCase();
  const cls = pc.includes('sctp') ? 'proto-sctp' : pc.includes('m3ua') ? 'proto-m3ua' :
              pc.includes('gsmtap') ? 'proto-gsmtap' : pc.includes('rr') ? 'proto-rr' :
              pc.includes('sms') ? 'proto-sms' : pc.includes('dtap') ? 'proto-dtap' : 'proto-def';
  const dir    = p.direction || (p.uplink ? 'UL' : 'DL');
  const dirCol = dir === 'UL' ? 'var(--red)' : dir === 'DL' ? 'var(--green)' : 'var(--t2)';

  const div = document.createElement('div');
  div.className = 'vty-popup pkt-popup';
  div.id = wid;
  div.dataset.pktFrame = p.frameNum;
  div.style.cssText = `top:${top}px;left:${left}px;z-index:210`;

  div.innerHTML = `
    <div class="vty-popup-header" onmousedown="startDrag(event,'${wid}')">
      <span class="proto ${cls}" style="font-size:10px;flex-shrink:0">${esc(p.protocol||'—')}</span>
      <span style="font-size:10px;color:${dirCol};font-weight:700;font-family:'Fira Code',monospace;flex-shrink:0;margin:0 4px">${esc(dir)}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px;font-family:'Fira Code',monospace;color:var(--cyan)">#${p.id} — ${esc((p.info||'').slice(0,80))}</span>
      <span style="font-size:10px;color:var(--t3);font-family:'Fira Code',monospace;margin-right:6px">${esc(p.opLabel||'')}</span>
      <button class="close-btn" onclick="document.getElementById('${wid}').remove()">✕</button>
    </div>
    <div class="detail-tabs-pop">
      <button class="active" onclick="pktPopTab('${wid}','decode',this)">Decode</button>
      <button onclick="pktPopTab('${wid}','hex',this)">Hex Dump</button>
      <button onclick="pktPopTab('${wid}','raw',this)">Raw JSON</button>
    </div>
    <div id="${wid}-decode" class="pkt-popup-body pkt-popup-decode" style="padding:8px 10px;font-family:'Fira Code',monospace;font-size:11px;line-height:1.8">
      <span style="color:var(--t3)">Chargement dissection…</span>
    </div>
    <div id="${wid}-hex" class="pkt-popup-body hex-dump" style="display:none"></div>
    <div id="${wid}-raw" class="pkt-popup-body hex-dump" style="display:none"></div>`;

  layer.appendChild(div);
  document.querySelectorAll('.vty-popup').forEach(pp => pp.style.zIndex = 200);
  div.style.zIndex = 210;

  // Decode — utilise les layers déjà présents ou demande au serveur (une seule fois)
  const decodeEl = document.getElementById(wid + '-decode');
  if (p.layers) {
    renderDecodeInto(p, decodeEl);
  } else if (p.frameNum && !p._pendingDissect) {
    p._pendingDissect = true;
    send({ type: 'packet_dissect_request', frameNum: p.frameNum });
  }

  // Hex
  const hexEl = document.getElementById(wid + '-hex');
  if (p.hexDump) {
    _renderHex(hexEl, p.hexDump);
  } else if (p.frameNum) {
    hexEl.setAttribute('data-frame-num', p.frameNum);
    send({ type: 'packet_hex_request', frameNum: p.frameNum });
  }

  // Raw JSON
  const c = Object.assign({}, p); delete c.hexDump;
  document.getElementById(wid + '-raw').textContent = JSON.stringify(c, null, 2);
}

function pktPopTab(wid, tab, btn) {
  ['decode','hex','raw'].forEach(t => {
    const el = document.getElementById(wid + '-' + t);
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
  const tabsEl = document.querySelector('#' + wid + ' .detail-tabs-pop');
  if (tabsEl) tabsEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ═══ VTY Popup Windows ═══
let vtyCounter = 0;
const vtyWindows = {};

function spawnVty() {
  vtyCounter++;
  const wid = 'vty-'+vtyCounter;
  const layer = document.getElementById('vty-layer');

  // Stagger position
  const offset = (vtyCounter-1) * 30;
  const top = 80 + (offset % 200);
  const left = 200 + (offset % 300);

  const div = document.createElement('div');
  div.className = 'vty-popup';
  div.id = wid;
  div.style.top = top+'px';
  div.style.left = left+'px';
  div.innerHTML = `
    <div class="vty-popup-header" onmousedown="startDrag(event,'${wid}')">
      <span class="title">VTY #${vtyCounter}</span>
      <select class="vty-op-sel" data-wid="${wid}"><option value="">OP…</option></select>
      <select class="vty-comp-sel" data-wid="${wid}">
        <option value="bsc">BSC</option><option value="msc">MSC</option><option value="hlr">HLR</option>
        <option value="bts">BTS</option><option value="mgw">MGW</option><option value="stp">STP</option>
        <option value="sgsn">SGSN</option><option value="ggsn">GGSN</option><option value="pcu">PCU</option>
        <option value="bb1">BB MS1 ☎ 4247</option>
        <option value="bb2">BB MS2 ☎ 4248</option>
      </select>
      <button class="btn primary" style="padding:3px 10px;font-size:11px" onclick="vtyPopConnect('${wid}')">Go</button>
      <button class="close-btn" onclick="vtyPopClose('${wid}')">✕</button>
    </div>
    <div class="vty-screen" id="${wid}-screen" style="display:none"></div>
    <div style="display:flex;align-items:center;justify-content:center;flex:1;color:var(--t3);font-size:12px;background:var(--term-bg)" id="${wid}-empty">Select OP + component → Go</div>
    <div class="vty-input-row">
      <span class="prm" id="${wid}-prm">$</span>
      <input type="text" placeholder="VTY command…" onkeydown="vtyPopKey(event,'${wid}')" autocomplete="off" spellcheck="false">
    </div>`;
  layer.appendChild(div);

  vtyWindows[wid] = { key:null, buffer:'', history:[], histIdx:-1 };
  updateVtySelects();
}

function vtyPopConnect(wid) {
  const popup = document.getElementById(wid);
  const opId = popup.querySelector('.vty-op-sel').value;
  const comp = popup.querySelector('.vty-comp-sel').value;
  if (!opId) return;
  const key = `${opId}-${comp}`;
  vtyWindows[wid].key = key;
  vtyWindows[wid].buffer = '';
  send({ type:'vty_connect', opId:parseInt(opId), component:comp });
}

function vtyPopClose(wid) {
  const w = vtyWindows[wid];
  if (w && w.key) send({ type:'vty_disconnect', key:w.key });
  delete vtyWindows[wid];
  const el = document.getElementById(wid);
  if (el) el.remove();
}

function vtyPopKey(e, wid) {
  const input = e.target;
  const w = vtyWindows[wid];
  if (!w) return;
  if (e.key==='Enter') {
    const cmd = input.value;
    if (!w.key) return;
    w.tab = null;
    w.buffer += `\x1b[cmd]${cmd}\x1b[/]\r\n`;
    w.history.push(cmd); w.histIdx = w.history.length;
    send({ type:'vty_exec', key:w.key, cmd });
    input.value = '';
    renderVtyPop(wid);
  } else if (e.key==='ArrowUp') {
    e.preventDefault();
    if (w.histIdx>0) { w.histIdx--; input.value=w.history[w.histIdx]||''; }
  } else if (e.key==='ArrowDown') {
    e.preventDefault();
    if (w.histIdx<w.history.length-1) { w.histIdx++; input.value=w.history[w.histIdx]||''; }
    else { w.histIdx=w.history.length; input.value=''; }
  } else if (e.key==='?') {
    // aide osmocom : liste les options possibles (serveur envoie 'partial?')
    e.preventDefault();
    w.tab = null;
    if (w.key) send({ type:'vty_complete', key:w.key, partial:input.value });
  } else if (e.key==='Tab') {
    // complétion : même listing osmocom, puis on complète le mot côté client
    e.preventDefault();
    if (w.key) { w.tab = { partial: input.value }; send({ type:'vty_complete', key:w.key, partial:input.value }); }
  }
}

// Complétion Tab : parse le listing osmocom renvoyé après 'partial?' et complète
// le dernier mot jusqu'au plus long préfixe commun (transport telnet ligne : pas
// de complétion char-level native, on la reconstruit côté client). Sans candidat
// fiable on ne touche pas l'input → au pire le listing s'affiche comme pour '?'.
function vtyTabComplete(wid, added) {
  const w = vtyWindows[wid];
  if (!w || !w.tab) return;
  const partial = w.tab.partial; w.tab = null;
  const cands = [];
  added.split(/\r?\n/).forEach(function(ln){
    const t = ln.replace(/\x1b\[[^m]*m/g,'').trim();
    if (!t || t[0]==='%') return;
    const first = t.split(/\s+/)[0];
    if (/^[A-Za-z0-9_.\-]+$/.test(first)) cands.push(first);   // token simple (pas prompt/<range>)
  });
  if (!cands.length) return;
  const parts = partial.split(/\s+/);
  const lastWord = parts[parts.length-1];
  let matching = cands.filter(function(c){ return c.indexOf(lastWord)===0; });
  if (!matching.length) return;
  const lcp = matching.reduce(function(a,b){ let i=0; while(i<a.length&&i<b.length&&a[i]===b[i]) i++; return a.slice(0,i); });
  const input = document.querySelector('#'+wid+' .vty-input-row input');
  if (!input) return;
  if (lcp.length > lastWord.length || (matching.length===1 && lcp===lastWord)) {
    parts[parts.length-1] = lcp;
    input.value = parts.join(' ') + (matching.length===1 ? ' ' : '');
    input.focus();
  }
}

function renderVtyPop(wid) {
  const w = vtyWindows[wid];
  if (!w) return;
  const screen = document.getElementById(wid+'-screen');
  if (!screen) return;
  screen.innerHTML = w.buffer
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\x1b\[sys\](.*?)\x1b\[\/\]/gs, '<span class="sys">$1</span>')
    .replace(/\x1b\[err\](.*?)\x1b\[\/\]/gs, '<span class="err">$1</span>')
    .replace(/\x1b\[cmd\](.*?)\x1b\[\/\]/gs, '<span class="cmd">$1</span>');
  screen.scrollTop = screen.scrollHeight;
}

function findVtyWid(key) {
  for (const [wid, w] of Object.entries(vtyWindows)) {
    if (w.key === key) return wid;
  }
  return null;
}

function vtyOnConnected(d) {
  let wid = findVtyWid(d.key);
  if (!wid) {
    // Find a window without a key
    for (const [w, state] of Object.entries(vtyWindows)) {
      if (!state.key) { state.key = d.key; state.buffer = ''; wid = w; break; }
    }
    if (!wid) return;
  }
  const w = vtyWindows[wid];
  const retryNote = d.retry > 0 ? ` (retry ${d.retry})` : '';
  w.buffer += `\x1b[sys]Connected to op${d.opId}/${d.component}:${d.port}${retryNote}\x1b[/]\r\n`;
  document.getElementById(wid+'-empty').style.display='none';
  document.getElementById(wid+'-screen').style.display='block';
  document.getElementById(wid+'-prm').textContent = `op${d.opId}/${d.component}> `;
  const title = document.querySelector(`#${wid} .title`);
  if (title) title.textContent = `VTY op${d.opId}/${d.component}`;
  renderVtyPop(wid);
}

function vtyOnData(d) {
  const wid = findVtyWid(d.key);
  if (!wid) return;
  const w = vtyWindows[wid];
  w.buffer += d.data;
  if (w.buffer.length > 120000) w.buffer = w.buffer.slice(-80000);
  if (w.tab) vtyTabComplete(wid, d.data);
  renderVtyPop(wid);
}

function vtyOnError(d) {
  const wid = findVtyWid(d.key);
  if (wid) { vtyWindows[wid].buffer += `\x1b[err]ERROR: ${d.msg}\x1b[/]\r\n`; renderVtyPop(wid); }
}

function vtyOnDisc(d) {
  const wid = findVtyWid(d.key);
  if (wid) {
    vtyWindows[wid].buffer += '\r\n--- disconnected ---\r\n';
    renderVtyPop(wid);
    vtyWindows[wid].key = null;
    document.getElementById(wid+'-prm').textContent = '$ ';
  }
}

// ═══ Dragging ═══
let dragState = null;

function startDrag(e, wid) {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
  const el = document.getElementById(wid);
  dragState = { el, startX: e.clientX, startY: e.clientY, origLeft: el.offsetLeft, origTop: el.offsetTop };
  // Bring to front
  document.querySelectorAll('.vty-popup').forEach(p => p.style.zIndex = 200);
  el.style.zIndex = 201;
  e.preventDefault();
}

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  dragState.el.style.left = (dragState.origLeft + dx) + 'px';
  dragState.el.style.top  = (dragState.origTop + dy) + 'px';
});

document.addEventListener('mouseup', () => { dragState = null; });

// ═══ Helpers ═══
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══ Init ═══
connectWs();
</script>

#rec-result .rec-tag{display:inline-block;font-weight:700;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:6px}
#rec-result .rec-tag.ciph{background:#7a2530;color:#ffd7d7}
#rec-result .rec-tag.deciph{background:#22603a;color:#d7ffe6}
#rec-result .btn{cursor:pointer}
.a5tag{font-weight:700}
.a5tag.a5on{background:#22603a;color:#d7ffe6}
.a5tag.a5off{background:#5a3a3a;color:#ffd7d7}
.a5tag.a5live{box-shadow:0 0 0 2px rgba(255,90,90,.55)}
</style>
<div id="rec-result"></div>
<script>
var recRunning=false;
function updateA5(a){ var el=document.getElementById('tag-a5'); if(!el)return;
  var on=((a.mode||'').replace(/\s/g,'').toLowerCase()==='a51')||a.algo>=1;
  el.textContent=on?('🔒 A5/'+(a.algo>=1?a.algo:1)+(a.active?' ●':'')):'🔓 clair (A5/0)';
  el.className='htag a5tag '+(on?'a5on':'a5off')+(a.active?' a5live':'');
  el.title='Mode de SESSION (osmo-bsc encryption) = '+(a.mode||'?')
          +' · clé observée ce run : '+(a.active?('oui, A5/'+a.algo):'pas encore')
          +' — le badge suit la session, pas les trames';
  window._lastKc=a.lastKc||window._lastKc||''; var kf=document.getElementById('rec-kc'); if(kf) kf.placeholder=window._lastKc?('Kc auto: '+window._lastKc):'Kc auto (aucun capté)'; }
function toggleRec(){ if(recRunning){send({type:'record_stop'});} else {send({type:'record_start',source:document.getElementById('rec-src').value,m:document.getElementById('rec-m').value,t:parseInt(document.getElementById('rec-t').value,10),kc:document.getElementById('rec-kc').value});} }
function fillKc(){ var kf=document.getElementById('rec-kc'); if(kf&&window._lastKc) kf.value=window._lastKc; }
function recFmtBytes(b){ if(b>=1e9)return (b/1e9).toFixed(2)+' Go'; if(b>=1e6)return (b/1e6).toFixed(1)+' Mo'; if(b>=1e3)return (b/1e3).toFixed(0)+' Ko'; return (b||0)+' o'; }
function setRec(on){ recRunning=on; var t=document.getElementById('tag-rec'), b=document.getElementById('rec-btn');
  if(b)b.textContent=on?'■ Stop rec':'⏺ Rec cfile'; if(t){t.textContent=on?'REC ●':'rec off'; t.style.color=on?'#e5484d':'';} }
function onRecStatus(d){ setRec(!!d.running); if(d.running){var t=document.getElementById('tag-rec'); if(t)t.textContent='REC ● '+recFmtBytes(d.bytes)+' / '+(d.seconds||0)+'s';} }
function recCopy(id){ var el=document.getElementById(id); if(el&&navigator.clipboard)navigator.clipboard.writeText(el.textContent); }
function onRecResult(d){ setRec(false); var box=document.getElementById('rec-result'); if(!box)return;
  var kc=d.kcPresent?('🔒 Kc (A5/'+d.kcAlgo+') = '+d.kc+(d.kcFromCache?(' (capté il y a '+Math.round((d.kcAgeMs||0)/1000)+'s)'):(d.kcManual?' (saisi)':' (live)'))):'Kc absent — lance une session chiffrée puis re-record';
  function bloc(tag,cls,id,txt){ return txt?('<div class="rec-cmd"><span class="rec-tag '+cls+'">'+tag+'</span> <button class="btn" onclick="recCopy(\''+id+'\')">copier</button><div><code id="'+id+'"></code></div></div>'):''; }
  box.style.display='block';
  box.innerHTML=
   '<div class="rec-h">⏺ tranche enregistrée<button class="btn" onclick="document.getElementById(\'rec-result\').style.display=\'none\'">✕</button></div>'+
   '<div class="rec-row"><b>Source</b> <code>'+(d.srcFile||'?')+'</code> — fichier <b>continu</b>, offset '+(d.offset||0)+'</div>'+
   '<div class="rec-row"><b>Tranche DL</b> '+recFmtBytes(d.bytes)+' · '+d.seconds+'s · -m '+(d.mode||'?')+' -t '+(d.timeslot!=null?d.timeslot:'?')+(d.note?' · '+d.note:'')+'</div>'+
   '<div class="rec-row">'+kc+'</div>'+
   bloc('1. EXTRAIRE — depuis l\'HÔTE','ciph','rec-dd',d.ddCmd)+
   bloc('(sortie du conteneur : incluse dans la commande ci-dessus)','ciph','rec-cp',d.cpCmd)+
   bloc('2. DECIPHERED','deciph','rec-cmd-d',d.cmdDeciphered)+
   bloc('2. CIPHERED','ciph','rec-cmd-c',d.cmdCiphered)+
   (d.pathUl?('<div class="rec-row" style="margin-top:10px"><b>Tranche MONTANTE</b> '+recFmtBytes(d.bytesUl||0)+' — le SMS <b>MO</b> est dans ce sens'+
    '<br><span style="opacity:.75;font-size:11px">\u26a0\ufe0f grgsm_decode ne démodule pas le montant (pas de FCCH/SCH) — pour lire le MO, tap GSMTAP udp/4729.</span></div>'+
    bloc('UL 1. EXTRAIRE','ciph','rec-dd-u',d.ddCmdUl)+
    bloc('UL 2. DECIPHERED','deciph','rec-cmd-ud',d.cmdUlDeciphered)+
    bloc('UL 2. CIPHERED','ciph','rec-cmd-uc',d.cmdUlCiphered)):'');
  function put(id,txt){ var e=document.getElementById(id); if(e)e.textContent=txt||''; }
  put('rec-dd',d.ddCmd); put('rec-cp',d.cpCmd);
  put('rec-cmd-d',d.cmdDeciphered); put('rec-cmd-c',d.cmdCiphered);
  put('rec-dd-u',d.ddCmdUl); put('rec-cp-u',d.cpCmdUl);
  put('rec-cmd-ud',d.cmdUlDeciphered); put('rec-cmd-uc',d.cmdUlCiphered);
  if(d.hint){ box.innerHTML+='<div class="rec-row" style="opacity:.8;font-size:11px;margin-top:6px">'+d.hint+'</div>';
              put('rec-dd',d.ddCmd); put('rec-cp',d.cpCmd);
              put('rec-cmd-d',d.cmdDeciphered); put('rec-cmd-c',d.cmdCiphered);
              put('rec-dd-u',d.ddCmdUl); put('rec-cp-u',d.cpCmdUl);
              put('rec-cmd-ud',d.cmdUlDeciphered); put('rec-cmd-uc',d.cmdUlCiphered); }
}

// ═══ Adaptation a la fenetre : reduction jusqu'a 70 %, puis defilement ═══
// LARGEUR MINIMALE REELLE de la mise en page, pas une valeur ronde : deux
// cartes FFT a 380 px, plus les gouttieres et le rembourrage de #fft-view.
// C'est elle qui decide si la page tient ; la deviner a 1200 ou 1280 aurait
// reduit des pages qui tenaient tres bien, ou coupe celles qui ne tenaient pas.
var APP_MIN_W = 2 * 380 + 12 + 2 * 12;      // 2 cartes + gap + padding
var APP_MIN_H = 620;                        // header + spectres + une lisiere de log
var APP_K_MIN = 0.70;                       // plancher : en dessous, on defile
// Taille de REPOS, avant toute contrainte de fenetre : le tableau de bord est
// rendu a 85 %. Ce n'est pas une correction d'un defaut, c'est un choix de
// densite - a 100 % il ne tenait qu'un spectre et trois lignes de journal a
// l'ecran, et il fallait faire defiler pour voir ce qui doit se regarder d'un
// coup d'oeil. Effet de bord utile : la mise en page se calcule dans 1/0,85 =
// 18 % de largeur en plus, donc elle atteint moins vite le plancher.
var APP_BASE  = parseFloat(localStorage.getItem('osmo.appZoom') || '0.85');

function fitApp() {
  var app = document.getElementById('app');
  if (!app) return;
  var w = window.innerWidth, h = window.innerHeight;
  // Le facteur est le plus CONTRAIGNANT des deux axes : reduire assez pour la
  // largeur mais pas pour la hauteur laisserait le bas coupe, et inversement.
  var k = APP_BASE * Math.min(1, w / APP_MIN_W, h / APP_MIN_H);
  var floored = k < APP_K_MIN;
  if (floored) k = APP_K_MIN;
  app.style.setProperty('--k', k.toFixed(4));
  // Sous le plancher seulement : on rend le defilement. Le garder en
  // permanence ferait apparaitre des barres sur un ecran qui n'en a pas besoin,
  // a cause des arrondis sous-pixel de la mise a l'echelle.
  document.body.classList.toggle('app-scroll', floored);
}
window.addEventListener('resize', fitApp);
window.addEventListener('orientationchange', fitApp);
fitApp();
// Les polices arrivent apres le premier calcul et changent les largeurs.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitApp);
</script>
</body>
</html>
